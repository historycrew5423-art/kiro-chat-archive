<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>绿环之城 · 太阳朋克小游戏</title>
	<style>
		html, body { margin: 0; height: 100%; background: #0b0f14; overflow: hidden; }
		body { font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; color: #fbf6ea; user-select: none; -webkit-user-select: none; }
		#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
		.panel { background: rgba(14, 22, 20, 0.42); border: 1px solid rgba(255, 255, 255, 0.16); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 14px; }
		#loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0f14; transition: opacity 1s; z-index: 10; }
		#loading .box { width: min(360px, 80vw); text-align: center; letter-spacing: 0.15em; font-size: 13px; color: #b9c2bb; }
		#bar { height: 3px; margin-top: 14px; background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden; }
		#bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #e9b65c, #9fd28f); transition: width 0.3s; }
		body.loaded #loading { opacity: 0; pointer-events: none; }
		#start { position: fixed; left: 50%; bottom: 9vh; transform: translateX(-50%); padding: 22px 30px 20px; text-align: center; opacity: 0; transition: opacity 1.2s 0.6s; pointer-events: none; }
		body.intro #start { opacity: 1; pointer-events: auto; }
		#start h1 { margin: 0; font-size: 26px; letter-spacing: 0.4em; font-weight: 600; text-shadow: 0 2px 18px rgba(0,0,0,0.4); }
		#start p { margin: 8px 0 16px; font-size: 13px; letter-spacing: 0.1em; color: #e3dccb; }
		button { font: inherit; cursor: pointer; }
		#go { padding: 10px 28px; font-size: 15px; letter-spacing: 0.25em; color: #1c1a12; background: linear-gradient(180deg, #ffe2a0, #e6a94f); border: 0; border-radius: 22px; box-shadow: 0 6px 24px rgba(230, 169, 79, 0.35); }
		#keys { margin-top: 14px; font-size: 12px; color: #cfd6cd; letter-spacing: 0.06em; line-height: 1.8; }
		kbd { display: inline-block; min-width: 1.4em; padding: 0 5px; border: 1px solid rgba(255,255,255,0.35); border-radius: 4px; font: 11px/1.6 ui-monospace, monospace; }
		#hud { position: fixed; left: max(16px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top)); padding: 12px 16px; opacity: 0; transition: opacity 0.8s; pointer-events: none; }
		body.playing #hud { opacity: 1; }
		#seedCount { font-size: 18px; letter-spacing: 0.1em; font-weight: 600; }
		#seedCount b { color: #ffd479; }
		#objective { margin-top: 4px; font-size: 12px; color: #dfe6dc; letter-spacing: 0.05em; max-width: 360px; }
		#toast { position: fixed; left: 50%; top: 16vh; transform: translateX(-50%); padding: 10px 20px; font-size: 15px; letter-spacing: 0.08em; opacity: 0; transition: opacity 0.4s; pointer-events: none; white-space: nowrap; }
		#toast.show { opacity: 1; }
		#win { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 28px 36px; text-align: center; opacity: 0; pointer-events: none; transition: opacity 1.2s; }
		#win.show { opacity: 1; pointer-events: auto; }
		#win h2 { margin: 0 0 8px; font-size: 24px; letter-spacing: 0.3em; }
		#win p { margin: 0 0 18px; color: #e3dccb; font-size: 14px; }
		#sound { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); padding: 8px 14px; font-size: 12px; letter-spacing: 0.12em; color: #fbf6ea; opacity: 0; transition: opacity 1s; }
		body.loaded #sound { opacity: 1; }
		#help { position: fixed; right: max(16px, env(safe-area-inset-right)); top: max(14px, env(safe-area-inset-top)); padding: 8px 12px; font-size: 11px; color: #d7ddd4; line-height: 1.7; opacity: 0; transition: opacity 1s; pointer-events: none; }
		body.playing #help { opacity: 0.85; }
		#fps { display: none; position: fixed; bottom: 8px; left: 8px; font: 11px/1.4 ui-monospace, monospace; color: #9f9; background: rgba(0,0,0,0.5); padding: 3px 6px; }
	</style>
</head>
<body>
	<canvas id="c"></canvas>
	<div id="loading"><div class="box">正在载入绿环之城…<div id="bar"><i></i></div></div></div>
	<div id="start" class="panel">
		<h1>绿环之城</h1>
		<p>帮袋鼠火枪手收集 10 颗阳光种子，坐电梯上到空中花园</p>
		<button id="go" type="button">开始</button>
		<div id="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 · <kbd>Shift</kbd> 大步跳 · <kbd>空格</kbd> 跳 · 拖动鼠标转镜头 · 滚轮远近</div>
	</div>
	<div id="hud" class="panel"><div id="seedCount">阳光种子 <b>0</b> / 10</div><div id="objective"></div></div>
	<div id="help" class="panel">WASD 移动 · Shift 跑 · 空格 跳<br>拖动鼠标转镜头 · 滚轮远近</div>
	<div id="toast" class="panel"></div>
	<div id="win" class="panel"><h2>抵达空中花园</h2><p id="winText"></p><button id="stay" type="button" class="panel" style="padding:8px 18px;color:#fbf6ea">在花园里逛逛</button></div>
	<button id="sound" type="button" class="panel">开启声音</button>
	<div id="fps"></div>
	<script src="./app.js"></script>
</body>
</html>
