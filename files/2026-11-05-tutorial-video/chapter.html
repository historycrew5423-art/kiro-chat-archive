<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: SC; src: url(./NotoSansSC.ttf); font-weight: 100 900; }
html,body { margin:0; width:1920px; height:1080px; background:#F6F5F1; font-family: SC, sans-serif; overflow:hidden; }
.wrap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.kicker { font-size:30px; color:#6b6b6b; letter-spacing:10px; display:flex; align-items:center; gap:14px; opacity:0; animation: up .5s cubic-bezier(.2,.8,.2,1) .1s forwards; }
.kicker i { width:12px; height:12px; border-radius:50%; background:#E8542F; display:inline-block; }
.title { font-size:168px; font-weight:900; color:#111; letter-spacing:6px; margin-top:26px; opacity:0; animation: up .6s cubic-bezier(.2,.8,.2,1) .25s forwards; }
.bar { width:0; height:9px; border-radius:5px; background:#E8542F; margin-top:34px; animation: grow .5s cubic-bezier(.2,.8,.2,1) .7s forwards; }
.dots { display:flex; gap:14px; margin-top:56px; opacity:0; animation: up .4s ease .9s forwards; }
.dots b { width:56px; height:7px; border-radius:4px; background:#cfcdc6; }
.dots b.on { background:#E8542F; }
.tag { position:absolute; left:72px; top:60px; font: 500 24px/1 SC; color:#9a988f; letter-spacing:4px; opacity:0; animation: up .5s ease .2s forwards; }
.tag em { font-style:normal; color:#E8542F; }
@keyframes up { from { opacity:0; transform: translateY(40px); } to { opacity:1; transform:none; } }
@keyframes grow { to { width:150px; } }
</style></head>
<body>
<div class="tag"><em>●</em> STEP 01 · 想清楚做什么</div>
<div class="wrap">
  <div class="kicker"><i></i>第 一 步</div>
  <div class="title">先把想法写下来</div>
  <div class="bar"></div>
  <div class="dots"><b class="on"></b><b></b><b></b><b></b><b></b><b></b></div>
</div>
<script>
// 渲染用：暂停所有动画，按时间跳帧
window.seek = (ms) => { document.getAnimations().forEach(a => { a.pause(); a.currentTime = ms; }); };
</script>
</body></html>
